# Hosted CI for when the repo is public (public repos get free Actions minutes).
# While the repo is private every job is skipped, so it uses no minutes:
# run scripts/ci.sh locally instead.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q
        env:
          BULK_BG_REMOVE_REAL_MODEL: "1"  # also run the real-model smoke test
