# Hosted CI for when the repo is public (public repos get free Actions minutes).
# While the repo is private every job is skipped, so it uses no minutes:
# run scripts/ci.sh locally instead.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # run it by hand from the Actions tab

jobs:
  test:
    if: ${{ !github.event.repository.private }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv lock --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked mypy
      - run: uv run --locked pytest -q
        env:
          BULK_BG_REMOVE_REAL_MODEL: "1"  # also run the real-model smoke test
