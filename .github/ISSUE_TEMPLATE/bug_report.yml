name: Bug report
description: Something failed, crashed or did the wrong thing.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [troubleshooting guide](https://github.com/Btike/bulk-bg-remove/blob/main/skills/bulk-bg-remove/references/troubleshooting.md) first.
        For a cut-out that came out wrong, use the **Bad cut-out** form instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or request
      description: The command you ran, or what you asked your agent to do.
      placeholder: bulk-bg-remove ~/photos --shop
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output or error
      description: The end of the output, or the `failed` entries of the last `--json` event. Remove anything private.
      render: text
  - type: textarea
    id: doctor
    attributes:
      label: Output of `bulk-bg-remove doctor`
      description: Version, Python, machine, RAM and checks. Plain `doctor`, not `--json` (that one includes your home path).
      render: text
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Linux in Docker or another container
        - Windows
    validations:
      required: true
  - type: dropdown
    id: entry
    attributes:
      label: How you ran it
      options:
        - Through an agent (Claude Code, Codex, other)
        - Command line
        - Local UI in the browser
    validations:
      required: true
