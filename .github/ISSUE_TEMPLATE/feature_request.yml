name: Feature request
description: Something the engine, the skill or the UI should do.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        A kind of photo that comes out badly is a **Bad cut-out**, not a feature request.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shop or marketplace output (size, background, padding, format)
        - Input or output format
        - Support for another agent
        - Speed or RAM
        - Local UI
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The job and where the photos end up, before the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: A flag, a preset, a change in what the agent does, or anything else.
