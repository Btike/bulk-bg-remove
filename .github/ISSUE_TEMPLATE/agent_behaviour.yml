name: Agent / skill behaviour
description: The agent ran the skill the wrong way, even though the engine worked.
labels: [skill]
body:
  - type: markdown
    attributes:
      value: |
        For when the cut-outs are fine but the agent was not: it asked what it should have decided, decided what it should have asked, picked the wrong flags, skipped the review or misreported.
        The steps it should follow are in [SKILL.md](https://github.com/Btike/bulk-bg-remove/blob/main/skills/bulk-bg-remove/SKILL.md).
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Claude Code
        - Codex
        - Cursor
        - Gemini CLI
        - Conductor
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Agent version and model
      placeholder: "Claude Code 2.x, Sonnet"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How the skill was installed
      options:
        - npx skills add
        - Claude Code plugin (/plugin install)
        - Codex plugin
        - Copied the skills folder by hand
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What went wrong
      multiple: true
      options:
        - Did not find or use the skill
        - Installing the engine failed
        - Asked something it should have decided (for example shop settings)
        - Decided something it should have asked (for example a weaker model, a RAM blocker)
        - Wrong profile or flags
        - Skipped the review, or misread the review sheets
        - The report back was wrong or missing
        - Other
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: What you asked
      placeholder: "remove the backgrounds in ~/Desktop/products, they're for my Shopify store"
    validations:
      required: true
  - type: textarea
    id: transcript
    attributes:
      label: What the agent did
      description: The relevant part of the conversation, commands included. Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should have done
      description: If you can, name the SKILL.md step it missed.
  - type: input
    id: version
    attributes:
      label: Engine version
      description: "`bulk-bg-remove --version`"
      placeholder: "0.1.1"
