[project]
name = "bulk-bg-remove"
version = "0.1.0"
description = "Remove image backgrounds in bulk, 100% locally, without touching a single subject pixel."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
keywords = ["background-removal", "remove-background", "rembg", "birefnet", "bulk", "image-processing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "rembg[cpu]>=2.0.50",
    "pillow>=11.3",
    "numpy>=1.26",
    "pillow-heif>=0.18",
]

[dependency-groups]
dev = [
    "pytest>=8.1",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bulk_bg_remove"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["bulk_bg_remove"]

[[tool.mypy.overrides]]
module = ["rembg", "rembg.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
