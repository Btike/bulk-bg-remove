<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bulk-bg-remove</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12' shape-rendering='crispEdges'%3E%3Crect width='12' height='12' fill='%2321262d'/%3E%3Cpath fill='%233fb950' d='M5 3h4v1H5zM4 4h6v4H4zM5 8h4v2H5zM4 10h6v1H4z'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0d1117; --panel: #161b22; --panel-2: #1c2128; --line: #30363d;
  --text: #e6edf3; --muted: #8b949e; --green: #3fb950; --green-dim: #0e4429;
  --green-2: #006d32; --green-3: #26a641; --yellow: #d29922; --red: #f85149;
  --blue: #58a6ff; --magenta: #db61a2; --cell: #21262d;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--mono); }
body { min-height: 100vh; }
button, input, select { font: inherit; color: inherit; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 12px; }
.logo { width: 36px; height: 36px; image-rendering: pixelated; flex: none; }
.brand h1 { margin: 0; font-size: 18px; letter-spacing: .12em; }
.brand small { display: block; color: var(--muted); letter-spacing: .04em; font-size: 12px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--panel); padding: 3px 10px; border-radius: 999px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.chip b { color: var(--text); font-weight: 600; }
.chip.ok b { color: var(--green); } .chip.warn b { color: var(--yellow); } .chip.bad b { color: var(--red); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; margin-bottom: 16px; }
.title { margin: 0 0 12px; font-size: 12px; letter-spacing: .14em; color: var(--muted); text-transform: uppercase; }
.drop { position: relative; border: 2px dashed var(--line); border-radius: 8px; padding: 44px 16px; text-align: center; cursor: pointer;
  background-color: var(--panel-2);
  background-image: linear-gradient(45deg, #ffffff06 25%, transparent 25%, transparent 75%, #ffffff06 75%),
                    linear-gradient(45deg, #ffffff06 25%, transparent 25%, transparent 75%, #ffffff06 75%);
  background-size: 24px 24px; background-position: 0 0, 12px 12px; transition: border-color .15s, background-color .15s; }
.drop:hover, .drop.over { border-color: var(--green); background-color: #12261a; }
.drop .big { font-size: 20px; letter-spacing: .12em; font-weight: 700; }
.drop .sub { color: var(--muted); margin-top: 6px; }
.drop .pick { margin-top: 14px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.path { flex: 1 1 280px; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 12px; }
.path:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); padding: 8px 14px; border-radius: 6px; cursor: pointer; letter-spacing: .06em; color: var(--text); text-decoration: none; display: inline-block; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--green-2); border-color: var(--green-3); color: #fff; font-weight: 700; }
.btn.primary:hover { background: var(--green-3); }
.btn.danger { border-color: #6e2b2b; color: var(--red); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.start { font-size: 18px; padding: 12px 28px; letter-spacing: .2em; animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { 50% { box-shadow: 0 0 0 3px var(--green-dim); } }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 14px; }
.opt label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: .08em; text-transform: uppercase; }
.opt select { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
.opt .hint { font-size: 12px; color: var(--muted); margin-top: 4px; min-height: 18px; }
.formats { color: var(--muted); font-size: 12px; margin-top: 10px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.stat { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
.stat span { display: block; font-size: 11px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.stat b { font-size: 20px; }
.stat b.small { font-size: 13px; word-break: break-all; font-weight: 600; }
.alert { border-radius: 6px; padding: 8px 12px; margin: 6px 0; font-size: 13px; }
.alert.bad { background: #2d1214; border: 1px solid #6e2b2b; color: #ffb4ad; }
.alert.warn { background: #2b2111; border: 1px solid #5c4515; color: #f2cc60; }
details { color: var(--muted); font-size: 13px; margin: 8px 0; }
details ul { margin: 6px 0 0; padding-left: 18px; max-height: 160px; overflow: auto; }
.bar { height: 14px; background: var(--cell); border-radius: 3px; overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; width: 0; background: var(--green); transition: width .3s; }
.bar.big { height: 22px; }
.bar.est > i { background: repeating-linear-gradient(90deg, var(--green-3) 0 6px, var(--green-2) 6px 12px); }
.progress-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.progress-head b { font-size: 22px; }
.lanes { display: grid; gap: 10px; margin: 16px 0; }
.lane { display: grid; grid-template-columns: 92px 1fr 52px; gap: 10px; align-items: center; font-size: 13px; }
.lane .who { color: var(--muted); letter-spacing: .08em; }
.lane > div { min-width: 0; }
.lane .what { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane .pct { text-align: right; color: var(--muted); }
.grid-wrap { overflow-x: auto; padding-bottom: 4px; }
.grid { display: flex; flex-wrap: wrap; gap: 3px; }
.cell { width: 13px; height: 13px; border-radius: 2px; background: var(--cell); outline: 1px solid #ffffff08; outline-offset: -1px; cursor: default; }
.cell.run { background: var(--yellow); animation: pulse .8s ease-in-out infinite alternate; }
.cell.done { background: var(--green-3); cursor: pointer; }
.cell.done:nth-child(3n) { background: var(--green); } .cell.done:nth-child(5n) { background: var(--green-2); }
.cell.fail { background: var(--red); }
.cell.skip { background: var(--green-dim); }
@keyframes pulse { to { opacity: .45; } }
.legend { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12px; margin-top: 8px; justify-content: flex-end; }
.legend .cell { width: 11px; height: 11px; cursor: default; animation: none; }
.log { background: #010409; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; height: 210px; overflow: auto; font-size: 12px; white-space: pre-wrap; word-break: break-word; }
.log .ok { color: var(--green); } .log .bad { color: var(--red); } .log .warn { color: var(--yellow); } .log .dim { color: var(--muted); }
.clear { text-align: center; padding: 8px 0 4px; }
.clear h2 { margin: 0; font-size: 30px; letter-spacing: .2em; color: var(--green); text-shadow: 3px 3px 0 var(--green-dim); }
.clear h2.partial { color: var(--yellow); text-shadow: 3px 3px 0 #3a2a05; }
.clear p { color: var(--muted); margin: 6px 0 14px; word-break: break-all; }
.hidden { display: none !important; }
.modal { position: fixed; inset: 0; background: #010409d9; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.modal .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; max-width: min(960px, 100%); width: 100%; }
.compare { position: relative; width: 100%; aspect-ratio: 4 / 3; overflow: hidden; border-radius: 6px;
  background-color: #fff; background-image: linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%), linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%);
  background-size: 20px 20px; background-position: 0 0, 10px 10px; }
.compare img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
.compare .before { clip-path: inset(0 50% 0 0); }
.compare input { position: absolute; inset: auto 0 8px; width: calc(100% - 16px); margin: 0 8px; }
.modal .row { justify-content: space-between; margin-top: 10px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 14px; z-index: 20; max-width: calc(100% - 32px); }
@media (max-width: 560px) { .lane { grid-template-columns: 58px 1fr 44px; } .lane .who { font-size: 11px; } .brand h1 { font-size: 15px; } .start { width: 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="logo" viewBox="0 0 12 12" aria-hidden="true" shape-rendering="crispEdges">
        <rect width="12" height="12" fill="#21262d"/>
        <g fill="#30363d"><rect x="0" y="0" width="2" height="2"/><rect x="4" y="0" width="2" height="2"/><rect x="8" y="0" width="2" height="2"/><rect x="2" y="2" width="2" height="2"/><rect x="6" y="2" width="2" height="2"/><rect x="10" y="2" width="2" height="2"/><rect x="0" y="4" width="2" height="2"/><rect x="2" y="6" width="2" height="2"/><rect x="0" y="8" width="2" height="2"/><rect x="2" y="10" width="2" height="2"/></g>
        <g fill="#3fb950"><rect x="5" y="3" width="4" height="1"/><rect x="4" y="4" width="6" height="4"/><rect x="5" y="8" width="4" height="2"/><rect x="4" y="10" width="6" height="1"/></g>
      </svg>
      <div><h1>BULK-BG-REMOVE</h1><small>100% local · subject pixels untouched</small></div>
    </div>
    <div class="chips" id="chips"></div>
  </header>

  <!-- 1 · SELECT -->
  <section id="screen-select">
    <div class="panel">
      <p class="title">Insert photos</p>
      <div class="drop" id="drop" tabindex="0" role="button" aria-label="Drop photos or a folder, or click to choose files">
        <div class="big">DROP PHOTOS OR A FOLDER</div>
        <div class="sub">or paste an image (⌘V / Ctrl+V)</div>
        <div class="pick">
          <button class="btn" id="pick-files" type="button">Choose photos</button>
          <button class="btn" id="pick-folder" type="button">Choose folder</button>
        </div>
        <input type="file" id="file-input" multiple hidden>
        <input type="file" id="folder-input" webkitdirectory multiple hidden>
      </div>
      <div class="row" style="margin-top:12px">
        <input class="path" id="path" placeholder="…or type a path: ~/Pictures/products" autocomplete="off" spellcheck="false">
        <button class="btn" id="load-path" type="button">Load</button>
      </div>
      <div class="options">
        <div class="opt"><label for="model">Model</label><select id="model"></select><div class="hint" id="model-hint"></div></div>
        <div class="opt"><label for="edges">Edges</label>
          <select id="edges">
            <option value="matte">Matte — refined hair, colours untouched</option>
            <option value="clean">Clean — also removes background halo</option>
            <option value="mask">Fast — no edge refinement</option>
          </select><div class="hint" id="edges-hint"></div></div>
        <div class="opt"><label for="format">Output</label>
          <select id="format"><option value="png">PNG (lossless)</option><option value="webp">WebP (lossless, smaller)</option></select>
          <div class="hint" id="output-hint"></div></div>
      </div>
      <div class="formats" id="formats"></div>
    </div>
  </section>

  <!-- 2 · PLAN -->
  <section id="screen-plan" class="hidden">
    <div class="panel">
      <p class="title">Stage select · plan</p>
      <div class="stats" id="plan-stats"></div>
      <div id="plan-alerts"></div>
      <details id="plan-skipped" class="hidden"><summary></summary><ul></ul></details>
      <div class="row" style="justify-content:space-between;margin-top:14px">
        <button class="btn" id="back" type="button">← Back</button>
        <button class="btn primary start" id="start" type="button">PRESS START</button>
      </div>
    </div>
  </section>

  <!-- 3 · RUN -->
  <section id="screen-run" class="hidden">
    <div class="panel">
      <div class="clear hidden" id="clear"><h2 id="clear-title">GAME CLEAR</h2><p id="clear-sub"></p>
        <div class="row" style="justify-content:center">
          <button class="btn primary" id="open" type="button">Open folder</button>
          <a class="btn" id="zip" href="#" download>Download ZIP</a>
          <button class="btn" id="again" type="button">New run</button>
        </div>
      </div>
      <div id="live">
        <div class="progress-head"><div><b id="pct">0%</b> <span class="chip" id="counts">0 / 0</span></div><div class="chips"><span class="chip" id="eta">ETA —</span><span class="chip" id="ram">RAM —</span></div></div>
        <div class="bar big"><i id="total-bar"></i></div>
        <div class="lanes" id="lanes"></div>
        <div class="row" style="justify-content:flex-end"><button class="btn danger" id="stop" type="button">■ Stop</button></div>
      </div>
    </div>
    <div class="panel">
      <p class="title" id="grid-title">Images</p>
      <div class="grid-wrap"><div class="grid" id="grid"></div></div>
      <div class="legend">Queued <span class="cell"></span> Running <span class="cell run"></span> Done <span class="cell done"></span> Failed <span class="cell fail"></span> Already done <span class="cell skip"></span></div>
    </div>
    <div class="panel"><p class="title">Log</p><div class="log" id="log" role="log" aria-live="polite"></div></div>
  </section>
</div>

<div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-label="Before and after">
  <div class="box">
    <div class="compare" id="compare"><img id="after" alt="After"><img id="before" class="before" alt="Before"><input type="range" id="slider" min="0" max="100" value="50" aria-label="Before / after"></div>
    <div class="row"><span id="modal-name" class="chip"></span><button class="btn" id="close" type="button">Close</button></div>
  </div>
</div>
<div class="toast hidden" id="toast"></div>

<script>
"use strict";
const TOKEN = new URLSearchParams(location.search).get("t") || "";
const $ = (id) => document.getElementById(id);
const state = { job: null, total: 0, done: 0, failed: 0, started: 0, workers: {}, perImage: 4, sources: {}, startedAt: 0, es: null, system: null };

function api(path, opts = {}) {
  const headers = Object.assign({ "X-Token": TOKEN }, opts.headers || {});
  return fetch(path, Object.assign({}, opts, { headers })).then(async (r) => {
    const body = r.headers.get("content-type")?.includes("json") ? await r.json() : await r.text();
    if (!r.ok) throw new Error(body?.detail || body || r.statusText);
    return body;
  });
}
function toast(msg, ms = 4000) { const t = $("toast"); t.textContent = msg; t.classList.remove("hidden"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hidden"), ms); }
function show(screen) { for (const s of ["select", "plan", "run"]) $("screen-" + s).classList.toggle("hidden", s !== screen); }
function fmtTime(s) { s = Math.max(0, Math.round(s)); if (s < 60) return s + "s"; const m = Math.floor(s / 60); if (m < 60) return m + "m " + String(s % 60).padStart(2, "0") + "s"; return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m"; }
function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }
function base(p) { return String(p).split(/[\\/]/).pop(); }
function log(text, cls = "") { const el = $("log"); const line = document.createElement("div"); if (cls) line.className = cls; line.textContent = text; el.appendChild(line); while (el.childNodes.length > 400) el.removeChild(el.firstChild); el.scrollTop = el.scrollHeight; }
function stat(label, value, small = false) { return `<div class="stat"><span>${esc(label)}</span><b class="${small ? "small" : ""}">${esc(String(value))}</b></div>`; }
function options() { return { model: $("model").value, edges: $("edges").value, output_format: $("format").value }; }

// ---------- system ----------
async function loadSystem() {
  const s = await api("/api/system"); state.system = s;
  const hw = s.hardware;
  $("model").innerHTML = s.models.map((m) => {
    const label = { "birefnet-general-lite": "Balanced — BiRefNet lite", "birefnet-general": "Max quality — BiRefNet", "isnet-general-use": "Low RAM — IS-Net (weaker edges)" }[m.id] || m.id;
    return `<option value="${esc(m.id)}" ${m.id === s.default_model ? "selected" : ""}>${esc(label)}</option>`;
  }).join("");
  $("formats").textContent = "Accepted: " + s.extensions.join(" ") + " — detected by content. Originals are never modified.";
  renderChips(); hints();
}
function renderChips() {
  const s = state.system; if (!s) return; const hw = s.hardware;
  const need = (s.models.find((m) => m.id === $("model").value) || {}).min_free_ram_gb || 0;
  const cls = hw.ram_available_gb >= need ? "ok" : "bad";
  $("chips").innerHTML = `<span class="chip">CPU <b>${esc(hw.cpu_name)}</b></span><span class="chip ${cls}">RAM free <b>${hw.ram_available_gb} GB</b></span><span class="chip">Device <b>${esc(hw.device)}</b></span>`;
}
function hints() {
  const s = state.system; if (!s) return;
  const m = s.models.find((x) => x.id === $("model").value);
  $("model-hint").textContent = m ? `needs ~${m.min_free_ram_gb} GB free RAM` : "";
  $("edges-hint").textContent = { matte: "best for hair & fur, bit-exact subject", clean: "recolours only semi-transparent edge pixels", mask: "fastest" }[$("edges").value];
  $("output-hint").textContent = "drag & paste → " + s.downloads + "/<name>-no-bg";
  renderChips();
}
for (const id of ["model", "edges", "format"]) $(id).addEventListener("change", hints);

// ---------- input ----------
async function readEntry(entry, prefix, out) {
  if (entry.isFile) { const file = await new Promise((res, rej) => entry.file(res, rej)); out.push({ file, path: prefix + file.name }); return; }
  if (entry.isDirectory) {
    const reader = entry.createReader(); let batch;
    do { batch = await new Promise((res, rej) => reader.readEntries(res, rej)); for (const e of batch) await readEntry(e, prefix + entry.name + "/", out); } while (batch.length);
  }
}
async function upload(items, kind) {
  if (!items.length) return toast("No files found");
  const form = new FormData();
  for (const { file, path } of items) { form.append("files", file, file.name); form.append("paths", path); }
  form.append("kind", kind); const o = options(); for (const k in o) form.append(k, o[k]);
  toast(`Uploading ${items.length} file(s) to the local engine…`, 60000);
  try { const res = await api("/api/jobs/upload", { method: "POST", body: form }); $("toast").classList.add("hidden"); planReady(res); }
  catch (e) { toast("✗ " + e.message, 7000); }
}
const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", async (e) => {
  e.preventDefault(); drop.classList.remove("over");
  const entries = [...e.dataTransfer.items].map((i) => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const out = []; for (const entry of entries) await readEntry(entry, "", out);
  const kind = entries.length === 1 && entries[0].isDirectory ? "folder" : "files";
  upload(out, kind);
});
drop.addEventListener("click", (e) => { if (e.target === drop || e.target.closest(".big,.sub")) $("file-input").click(); });
drop.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("file-input").click(); } });
$("pick-files").addEventListener("click", (e) => { e.stopPropagation(); $("file-input").click(); });
$("pick-folder").addEventListener("click", (e) => { e.stopPropagation(); $("folder-input").click(); });
$("file-input").addEventListener("change", (e) => { upload([...e.target.files].map((f) => ({ file: f, path: f.name })), "files"); e.target.value = ""; });
$("folder-input").addEventListener("change", (e) => { upload([...e.target.files].map((f) => ({ file: f, path: f.webkitRelativePath || f.name })), "folder"); e.target.value = ""; });
document.addEventListener("paste", (e) => {
  if ($("screen-select").classList.contains("hidden") || document.activeElement === $("path")) return;
  const files = [...(e.clipboardData?.items || [])].filter((i) => i.kind === "file").map((i) => i.getAsFile()).filter(Boolean);
  if (files.length) { e.preventDefault(); upload(files.map((f, n) => ({ file: f, path: f.name && f.name !== "image.png" ? f.name : `pasted-${n + 1}.png` })), "paste"); }
});
async function loadPath() {
  const path = $("path").value.trim(); if (!path) return $("path").focus();
  try { planReady(await api("/api/jobs/path", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ path }, options())) })); }
  catch (e) { toast("✗ " + e.message, 7000); }
}
$("load-path").addEventListener("click", loadPath);
$("path").addEventListener("keydown", (e) => { if (e.key === "Enter") loadPath(); });

// ---------- plan ----------
function planReady(res) {
  state.job = res.job;
  const scan = res.events.find((e) => e.type === "scan"); const plan = res.events.find((e) => e.type === "plan");
  const inv = scan.inventory; const hw = scan.hardware;
  state.perImage = plan.images ? plan.eta_seconds / plan.images * plan.workers : 4;
  $("plan-stats").innerHTML =
    stat("Images", plan.images + (plan.already_done ? ` (+${plan.already_done} done)` : "")) +
    stat("Mode", plan.mode === "parallel" ? `PARALLEL ×${plan.workers}` : "QUEUE ×1") +
    stat("ETA", "~" + fmtTime(plan.eta_seconds)) +
    stat("RAM", `${plan.min_free_ram_gb} / ${hw.ram_available_gb} GB`) +
    stat("Model · edges", `${plan.model} · ${plan.edges}`, true) +
    stat("Output", res.output_display || res.output, true);
  const alerts = [];
  for (const b of plan.blockers) alerts.push(`<div class="alert bad">✗ ${esc(b)}</div>`);
  for (const w of plan.warnings) alerts.push(`<div class="alert warn">! ${esc(w)}</div>`);
  if (!plan.blockers.length && plan.mode === "queue" && plan.binding_limit === "RAM") alerts.push(`<div class="alert warn">One image at a time: free RAM fits one model copy. Close apps for a faster parallel run.</div>`);
  $("plan-alerts").innerHTML = alerts.join("");
  const sk = $("plan-skipped"); const skipped = inv.skipped || [];
  sk.classList.toggle("hidden", !skipped.length);
  sk.querySelector("summary").textContent = `${skipped.length} file(s) not processed`;
  sk.querySelector("ul").innerHTML = skipped.map((s) => `<li>${esc(base(s.path))} — ${esc(s.reason)}</li>`).join("");
  $("start").disabled = !res.ok || plan.images === 0;
  $("start").textContent = plan.images === 0 && plan.already_done ? "ALL DONE" : "PRESS START";
  state.total = plan.images; state.alreadyDone = plan.already_done || 0; state.outputDisplay = res.output_display;
  show("plan"); if (!$("start").disabled) $("start").focus();
}
$("back").addEventListener("click", () => show("select"));

// ---------- run ----------
function resetRun() {
  Object.assign(state, { done: 0, failed: 0, started: 0, workers: {}, sources: {}, startedAt: Date.now() });
  $("lanes").innerHTML = ""; $("log").innerHTML = ""; $("clear").classList.add("hidden"); $("live").classList.remove("hidden");
  const grid = $("grid"); grid.innerHTML = "";
  for (let i = 0; i < state.alreadyDone; i++) grid.insertAdjacentHTML("beforeend", `<div class="cell skip" title="already done"></div>`);
  for (let i = 0; i < state.total; i++) grid.insertAdjacentHTML("beforeend", `<div class="cell" id="cell-${i}" title="queued"></div>`);
  $("grid-title").textContent = `Images · ${state.total} to process`;
  updateTotals();
}
$("start").addEventListener("click", async () => {
  $("start").disabled = true; resetRun(); show("run");
  try { await api(`/api/jobs/${state.job}/start`, { method: "POST" }); listen(); }
  catch (e) { toast("✗ " + e.message, 7000); show("plan"); $("start").disabled = false; }
});
async function pollRam() {
  if ($("screen-run").classList.contains("hidden") || !$("clear").classList.contains("hidden")) return;
  try {
    const s = await api("/api/system"); const free = s.hardware.ram_available_gb;
    state.system.hardware = s.hardware; renderChips();
    if (!$("ram").textContent.startsWith("⏸")) { $("ram").textContent = `RAM free ${free} GB`; $("ram").className = "chip " + (free < 2 ? "bad" : free < 4 ? "warn" : "ok"); }
  } catch (_) { /* transient */ }
}
setInterval(pollRam, 3000);
function listen() {
  if (state.es) state.es.close();
  const es = new EventSource(`/api/jobs/${state.job}/events?t=${encodeURIComponent(TOKEN)}`); state.es = es;
  es.onmessage = (m) => handle(JSON.parse(m.data));
  es.onerror = () => { if (es.readyState === 2) es.close(); };
}
function lane(worker) {
  if (state.workers[worker]) return state.workers[worker];
  const el = document.createElement("div"); el.className = "lane";
  el.innerHTML = `<span class="who">WORKER ${Number(worker) + 1}</span><div><div class="what">loading model…</div><div class="bar est"><i></i></div></div><span class="pct">—</span>`;
  $("lanes").appendChild(el);
  const w = { el, job: null, pct: 0, timer: null, stageAt: 0 }; state.workers[worker] = w; return w;
}
function setLane(w, pct, text, estimated) {
  w.pct = pct; w.el.querySelector(".bar i").style.width = pct + "%";
  w.el.querySelector(".bar").classList.toggle("est", !!estimated);
  w.el.querySelector(".pct").textContent = (estimated ? "~" : "") + Math.round(pct) + "%";
  if (text !== undefined) w.el.querySelector(".what").textContent = text;
}
function animateRemoving(w) {
  clearInterval(w.timer); const start = Date.now(); const span = Math.max(1, state.perImage * 0.75) * 1000;
  w.timer = setInterval(() => { const f = Math.min(1, (Date.now() - start) / span); setLane(w, 10 + 58 * f, undefined, true); }, 200);
}
function updateTotals() {
  const finished = state.done + state.failed; const pct = state.total ? Math.round(finished / state.total * 100) : 100;
  $("pct").textContent = pct + "%"; $("total-bar").style.width = pct + "%";
  $("counts").textContent = `${finished} / ${state.total} · ✓ ${state.done} · ✗ ${state.failed}`;
  if (finished && finished < state.total) { const rate = (Date.now() - state.startedAt) / 1000 / finished; $("eta").textContent = "ETA ~" + fmtTime(rate * (state.total - finished)); }
  else if (finished >= state.total && state.total) $("eta").textContent = "ETA 0s";
}
function handle(e) {
  switch (e.type) {
    case "run_started": log(`▶ RUN · ${e.images} image(s)`, "dim"); break;
    case "model_download": log(`⬇ downloading model ${e.model} (first run only)…`, "warn"); break;
    case "model_ready": log(`✓ model ${e.model} ready`, "ok"); break;
    case "worker_loading": lane(e.worker); break;
    case "worker_ready": setLane(lane(e.worker), 0, "ready", false); log(`worker ${e.worker + 1} ready`, "dim"); break;
    case "worker_failed": setLane(lane(e.worker), 0, "✗ " + e.reason, false); log(`✗ worker ${e.worker + 1}: ${e.reason}`, "bad"); break;
    case "job_started": {
      state.sources[e.job] = e.source; const w = lane(e.worker); w.job = e.job; setLane(w, 0, base(e.source), false);
      const c = $("cell-" + e.job); if (c) { c.className = "cell run"; c.title = base(e.source); } break; }
    case "job_stage": {
      const w = lane(e.worker); clearInterval(w.timer);
      setLane(w, e.progress, `${base(state.sources[e.job] || "")} · ${e.stage}`, false);
      if (e.stage === "removing") animateRemoving(w); break; }
    case "job_done": {
      const w = lane(e.worker); clearInterval(w.timer); setLane(w, 100, `${base(state.sources[e.job] || "")} ✓`, false);
      state.done++; const c = $("cell-" + e.job); if (c) { c.className = "cell done"; c.title = `${base(state.sources[e.job] || "")} — ${e.width}×${e.height}, ${e.seconds}s · click to compare`; c.onclick = () => openCompare(e.job); }
      log(`✓ ${base(state.sources[e.job] || "")}  ${e.width}×${e.height}  ${e.seconds}s`, "ok"); updateTotals(); break; }
    case "job_failed": {
      if (e.worker !== null && e.worker !== undefined) { const w = lane(e.worker); clearInterval(w.timer); setLane(w, 0, "✗ " + base(state.sources[e.job] || ""), false); }
      state.failed++; const c = $("cell-" + e.job); if (c) { c.className = "cell fail"; c.title = e.reason; }
      log(`✗ ${base(state.sources[e.job] || "job " + e.job)}  ${e.reason}`, "bad"); updateTotals(); break; }
    case "paused": $("ram").textContent = `⏸ RAM ${e.free_ram_gb} GB`; $("ram").className = "chip bad"; log(`⏸ PAUSED: free RAM ${e.free_ram_gb} GB < ${e.needed_gb} GB — close some apps`, "warn"); break;
    case "resumed": $("ram").textContent = `RAM ${e.free_ram_gb} GB`; $("ram").className = "chip ok"; log(`▶ RESUMED: ${e.free_ram_gb} GB free`, "ok"); break;
    case "verify_started": log(`▣ VERIFY · checking ${e.outputs} output(s)…`, "dim"); break;
    case "error": log("✗ " + e.message, "bad"); toast("✗ " + e.message, 7000); break;
    case "finished": finish(e); break;
  }
}
function finish(e) {
  for (const w of Object.values(state.workers)) clearInterval(w.timer);
  const failed = e.failed.length; const title = $("clear-title");
  title.textContent = failed ? "STAGE CLEAR" : "GAME CLEAR"; title.classList.toggle("partial", !!failed);
  $("clear-sub").textContent = `${e.processed} done · ${failed} failed · ${e.already_done} already done · ${fmtTime(e.seconds)} → ${state.outputDisplay || e.output}`;
  for (const w of e.warnings) log(`! ${base(w.path)}: ${w.warning}`, "warn");
  for (const f of e.failed) log(`✗ ${base(f.path)}: ${f.reason}`, "bad");
  log(`■ ${failed ? "STAGE" : "GAME"} CLEAR · output → ${e.output}`, failed ? "warn" : "ok");
  $("zip").href = `/api/jobs/${state.job}/zip?t=${encodeURIComponent(TOKEN)}`;
  $("live").classList.add("hidden"); $("clear").classList.remove("hidden");
  if (state.es) state.es.close();
}
$("stop").addEventListener("click", async () => { $("stop").disabled = true; try { await api(`/api/jobs/${state.job}/cancel`, { method: "POST" }); log("■ stopping after the current image(s)…", "warn"); } catch (e) { toast(e.message); } });
$("open").addEventListener("click", async () => { try { await api(`/api/jobs/${state.job}/open`, { method: "POST" }); } catch (e) { toast("✗ " + e.message); } });
$("again").addEventListener("click", () => { $("stop").disabled = false; show("select"); loadSystem(); });

// ---------- compare ----------
function openCompare(job) {
  const q = `t=${encodeURIComponent(TOKEN)}&image=${job}`;
  $("before").src = `/api/jobs/${state.job}/preview?${q}&side=before`;
  $("after").src = `/api/jobs/${state.job}/preview?${q}&side=after`;
  $("modal-name").textContent = base(state.sources[job] || ""); $("slider").value = 50; slide(); $("modal").classList.remove("hidden"); $("close").focus();
}
function slide() { $("before").style.clipPath = `inset(0 ${100 - $("slider").value}% 0 0)`; }
$("slider").addEventListener("input", slide);
$("close").addEventListener("click", () => $("modal").classList.add("hidden"));
$("modal").addEventListener("click", (e) => { if (e.target === $("modal")) $("modal").classList.add("hidden"); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("modal").classList.add("hidden"); });

const params = new URLSearchParams(location.search);
loadSystem().then(() => {
  const pick = (id, value) => { if (value && [...$(id).options].some((o) => o.value === value)) $(id).value = value; };
  pick("model", params.get("m")); pick("edges", params.get("e")); pick("format", params.get("f")); hints();
  if (params.get("p")) { $("path").value = params.get("p"); loadPath(); }
}).catch((e) => toast("✗ " + e.message, 10000));
</script>
</body>
